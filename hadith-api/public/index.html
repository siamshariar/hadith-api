<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hadith Collection - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .language-selector {
            margin: 20px 0;
            text-align: center;
        }
        
        .language-selector select {
            padding: 10px 20px;
            font-size: 1.1em;
            border-radius: 25px;
            border: 2px solid white;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }
        
        .section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
        }
        
        .section-title {
            font-size: 1.8em;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }
        
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s;
            border-left: 4px solid #667eea;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .card-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .card-meta {
            color: #666;
            font-size: 0.9em;
        }
        
        .card-count {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-top: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 1em;
            opacity: 0.9;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Hadith Collection</h1>
            <p>Complete Collection with 17 Languages</p>
            
            <div class="language-selector">
                <select id="languageSelect" onchange="changeLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="ar">العربية (Arabic)</option>
                    <option value="bn">বাংলা (Bengali)</option>
                    <option value="ur">اردو (Urdu)</option>
                    <option value="hi">हिन्दी (Hindi)</option>
                    <option value="tr">Türkçe (Turkish)</option>
                    <option value="fr">Français (French)</option>
                    <option value="es">Español (Spanish)</option>
                    <option value="id">Indonesia (Indonesian)</option>
                    <option value="fa">فارسی (Persian)</option>
                    <option value="ru">Русский (Russian)</option>
                    <option value="zh">中文 (Chinese)</option>
                    <option value="bs">Bosanski (Bosnian)</option>
                    <option value="tl">Tagalog</option>
                    <option value="vi">Tiếng Việt (Vietnamese)</option>
                    <option value="si">සිංහල (Sinhala)</option>
                    <option value="ug">ئۇيغۇرچە (Uyghur)</option>
                </select>
            </div>
        </header>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="statBooks">-</div>
                <div class="stat-label">Books</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statCategories">-</div>
                <div class="stat-label">Categories</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statHadiths">-</div>
                <div class="stat-label">Hadiths</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">17</div>
                <div class="stat-label">Languages</div>
            </div>
        </div>
        
        <div class="main-content">
            <!-- Books Section -->
            <div class="section">
                <h2 class="section-title">📖 Hadith Books</h2>
                <div id="booksList" class="card-grid">
                    <div class="loading">Loading books...</div>
                </div>
            </div>
            
            <!-- Categories Section -->
            <div class="section">
                <h2 class="section-title">📂 Categories</h2>
                <div id="categoriesList" class="card-grid">
                    <div class="loading">Loading categories...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        let currentLang = 'en';
        
        // Change language
        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('selectedLanguage', lang);
            loadBooks();
            loadCategories();
        }
        
        // Load books
        async function loadBooks() {
            const container = document.getElementById('booksList');
            container.innerHTML = '<div class="loading">Loading books...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/books?lang=${currentLang}`);
                const data = await response.json();
                
                // Handle different response structures
                const books = data.data || data.books || data;
                
                if (books && books.length > 0) {
                    document.getElementById('statBooks').textContent = books.length;
                    
                    container.innerHTML = books.map(book => `
                        <div class="card" onclick="openBook(${book.id}, '${book.slug || book.id}')">
                            <div class="card-title">${book.title || book.name}</div>
                            <div class="card-meta">${book.name_ar || ''}</div>
                            <div class="card-count">${book.hadeeths_count || book.hadiths_count || book.chapters_count || 0} ${book.hadeeths_count || book.hadiths_count ? 'Hadiths' : 'Chapters'}</div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="loading">No books found</div>';
                }
            } catch (error) {
                console.error('Error loading books:', error);
                container.innerHTML = '<div class="loading">Error loading books</div>';
            }
        }
        
        // Load categories
        async function loadCategories() {
            const container = document.getElementById('categoriesList');
            container.innerHTML = '<div class="loading">Loading categories...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/categories/roots?lang=${currentLang}`);
                const data = await response.json();
                
                // Handle different response structures (array directly or nested)
                const categories = Array.isArray(data) ? data : (data.categories || data.data || []);
                
                if (categories && categories.length > 0) {
                    document.getElementById('statCategories').textContent = categories.length;
                    
                    container.innerHTML = categories.map(cat => `
                        <div class="card" onclick="openCategory(${cat.id})">
                            <div class="card-title">${cat.title || cat.name}</div>
                            <div class="card-count">${cat.hadeeths_count || cat.hadiths_count || 0} Hadiths</div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="loading">No categories found</div>';
                }
            } catch (error) {
                console.error('Error loading categories:', error);
                container.innerHTML = '<div class="loading">Error loading categories</div>';
            }
        }
        
        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/info`);
                const data = await response.json();
                
                if (data.statistics) {
                    document.getElementById('statHadiths').textContent = 
                        data.statistics.total_hadiths || data.statistics.hadiths || '-';
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        // Open book page
        function openBook(bookId, bookSlug) {
            window.location.href = `book.html?id=${bookId}&slug=${bookSlug}&lang=${currentLang}`;
        }
        
        // Open category page
        function openCategory(categoryId) {
            window.location.href = `category.html?id=${categoryId}&lang=${currentLang}`;
        }
        
        // Initialize
        window.onload = function() {
            // Restore saved language
            const savedLang = localStorage.getItem('selectedLanguage');
            if (savedLang) {
                currentLang = savedLang;
                document.getElementById('languageSelect').value = savedLang;
            }
            
            loadBooks();
            loadCategories();
            loadStats();
        };
    </script>
</body>
</html>
